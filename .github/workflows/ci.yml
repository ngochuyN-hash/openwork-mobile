name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Bridge tests
        working-directory: bridge
        run: node --test

      - name: Worker tests
        run: node --test worker/test/*.test.mjs

      - name: Web install
        working-directory: web
        run: npm ci

      - name: Web tests
        working-directory: web
        run: node --test

      - name: Web build
        working-directory: web
        run: npm run build
